[project]
name = "apuracao-2-turno"
version = "0.1.0"
description = "Sala de guerra local para a apuração do 2º turno presidencial 2026"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "asn1tools>=0.166",
    "duckdb>=1.1",
    "pyarrow>=17",
    "numpy>=2.0",
    "h3>=4.1",
    "orjson>=3.10",
    "aiohttp>=3.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
