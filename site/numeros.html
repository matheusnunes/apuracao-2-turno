<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuração 2º turno · números</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%228%22 height=%2216%22 fill=%22%233987e5%22/%3E%3Crect x=%228%22 width=%228%22 height=%2216%22 fill=%22%23d9731f%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<style>
  body { height: auto; overflow: auto; }
  .npage { max-width: 1800px; margin: 0 auto; padding: .8rem 1.2rem 2rem; display: grid; gap: .9rem; }
  .nhead { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; justify-content: space-between; }
  .nhead h1 { margin: 0; font-size: 1.5rem; }
  .ngrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: .6rem; }
  .nbox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: .7rem .9rem; }
  .nbox .l { font-size: .9rem; color: var(--ink-2); display: flex; align-items: center; }
  .nbox .v { font-size: 2.3rem; font-weight: 750; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .nbox .s { font-size: .85rem; color: var(--muted); }
  #n-phase { font-size: 1.1rem; font-weight: 700; }
  #n-call { font-size: 2rem; font-weight: 800; display: flex; align-items: center; gap: .4rem; }
  #n-mix { color: var(--ink-2); }
  table.tbl { font-size: 1rem; }
</style>
</head>
<body>
<div id="banners" class="banners" hidden></div>
<div class="npage">
  <div class="nhead">
    <h1>Apuração · 2º turno · Presidente <small id="clock" style="font-weight:400;color:var(--muted)"></small></h1>
    <div class="fresh" id="fresh"></div>
    <a class="quiet" href="index.html">tela com mapa</a>
  </div>
  <div id="n-phase"></div>
  <div id="n-call" hidden></div>
  <div class="ngrid" id="n-placar"></div>
  <div id="n-mix"></div>
  <div class="ngrid" id="n-grid"></div>
  <div class="card"><h2>Por região</h2><table class="tbl" id="n-reg"></table><div class="lg-note" id="n-note"></div></div>
</div>
<script type="module" src="js/numeros.js"></script>
</body>
</html>
